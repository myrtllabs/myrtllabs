<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 Welcome to Ezekiel &amp; Ezariah's Birthday Party! 🎈</title>
<style>
  :root{
    --font:'Comic Sans MS','Comic Sans','Chalkboard SE','Baloo 2',system-ui,'Segoe UI',sans-serif;
    --ink:#173a2e; --gold:#ffcf4d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;font-family:var(--font);}
  body{position:relative;cursor:default;}

  /* ---------------- SCENE ---------------- */
  .sky{position:fixed;inset:0;z-index:0;
    background:linear-gradient(180deg,#79c9ff 0%,#a5e0ff 30%,#d9f2df 60%,#fdf1c7 82%,#ffe7a8 100%);}
  .sky::after{content:'';position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 120%,rgba(255,214,120,.35),rgba(255,214,120,0) 60%);}
  .sun{position:fixed;top:5vh;left:50%;transform:translateX(-50%);width:24vmin;height:24vmin;border-radius:50%;z-index:1;
    background:radial-gradient(circle,#fff7cf 0%,#ffe680 52%,#ffd24d 66%,rgba(255,210,77,0) 70%);
    animation:sunpulse 6s ease-in-out infinite;}
  @keyframes sunpulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}

  .hill{position:fixed;left:-12vw;right:-12vw;border-radius:50%/100% 100% 0 0;z-index:2;}
  .hill.h1{bottom:20vh;height:36vh;background:#a3dc8c;}
  .hill.h2{bottom:11vh;height:32vh;background:#7ecb6b;left:-24vw;right:-6vw;}
  .hill.h3{bottom:0;height:24vh;background:#54b258;left:-6vw;right:-26vw;}
  .ground{position:fixed;bottom:0;left:0;right:0;height:13vh;background:linear-gradient(180deg,#4aa64f,#3c8f43);z-index:3;}

  .acacia{position:fixed;bottom:17vh;z-index:2;width:24vmin;fill:#3f7f46;opacity:.9;
    filter:drop-shadow(0 4px 5px rgba(0,50,20,.15));}

  .decor{position:fixed;z-index:3;user-select:none;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,60,20,.22));}
  .cloud{z-index:1;font-size:12vmin;animation:drift linear infinite;}
  @keyframes drift{from{transform:translateX(-34vw)}to{transform:translateX(134vw)}}
  .bird{z-index:2;font-size:5.5vmin;animation:fly linear infinite;}
  @keyframes fly{0%{transform:translateX(-14vw) translateY(0)}50%{transform:translateX(56vw) translateY(-4vh)}100%{transform:translateX(126vw) translateY(0)}}
  .walker{bottom:3vh;font-size:11vmin;z-index:4;left:-16vw;animation:walk linear infinite,bob .9s ease-in-out infinite;}
  @keyframes walk{from{left:-16vw}to{left:116vw}}
  @keyframes bob{0%,100%{margin-bottom:0}50%{margin-bottom:1.3vh}}
  .walker.flip{transform:scaleX(-1);}
  .balloon{z-index:5;font-size:11vmin;bottom:-24vh;animation:rise linear infinite;}
  @keyframes rise{0%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-64vh) rotate(6deg)}100%{transform:translateY(-128vh) rotate(-6deg)}}

  /* ---------------- BUNTING ---------------- */
  #bunting{position:fixed;top:0;left:0;right:0;height:10vmin;z-index:7;pointer-events:none;}
  #bunting .string{position:absolute;top:2vmin;left:0;right:0;height:.5vmin;
    background:linear-gradient(90deg,transparent,#6b4423 4%,#6b4423 96%,transparent);border-radius:99px;}
  #bunting .flags{position:absolute;top:2vmin;left:0;right:0;display:flex;justify-content:space-evenly;}
  .flag{width:5.2vmin;height:6.6vmin;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;
    box-shadow:inset 0 -1vmin 1.5vmin rgba(0,0,0,.12);animation:sway 4s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

  /* ---------------- WELCOME POSTER ---------------- */
  .center{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:12vmin 4vmin 4vmin;}
  .poster{display:flex;flex-direction:column;align-items:center;text-align:center;
    background:rgba(255,255,255,.85);backdrop-filter:blur(4px);border:1.1vmin solid #fff;border-radius:6vmin;
    padding:5vmin 7vmin;box-shadow:0 2.4vmin 6vmin rgba(0,60,30,.32);max-width:min(1250px,94vw);}
  .eyebrow{display:inline-block;background:var(--ink);color:var(--gold);font-size:3vmin;font-weight:bold;
    letter-spacing:.04em;padding:.3em 1.2em;border-radius:99px;}
  .names{font-size:8.6vmin;line-height:1;color:var(--ink);font-weight:bold;margin:2vmin 0 .3vmin;
    text-shadow:0 4px 0 var(--gold),0 6px 0 rgba(0,0,0,.06);}
  .names .amp{color:#ff7a2e;}
  h1{font-size:8vmin;line-height:1;color:#ff7a2e;text-shadow:0 4px 0 #ffd76a,0 6px 0 rgba(0,0,0,.06);}
  .cakes{font-size:8vmin;margin-top:1.6vmin;letter-spacing:.4vmin;animation:bob2 1.6s ease-in-out infinite;}
  @keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4vmin)}}
  .msg{font-size:3.4vmin;color:#3a5c4d;font-weight:bold;margin-top:1.6vmin;}

  .startlink{display:inline-block;margin-top:3.4vmin;font-family:var(--font);font-size:2.9vmin;font-weight:bold;
    color:#2b6b4f;background:rgba(255,255,255,.8);border:.45vmin solid #bfe0cd;border-radius:99px;
    padding:.5em 1.3em;text-decoration:none;box-shadow:0 .6vmin 0 #bfe0cd;transition:transform .08s;}
  .startlink:active{transform:translateY(.5vmin);box-shadow:0 .2vmin 0 #bfe0cd;}

  /* sound toggle (top-right) */
  #soundBtn{position:fixed;top:2.6vmin;right:2.6vmin;z-index:20;font-family:var(--font);border:none;cursor:pointer;
    font-size:2.8vmin;font-weight:bold;color:#7a4200;background:rgba(255,255,255,.88);border-radius:99px;
    padding:.45em 1em;box-shadow:0 .6vmin 1.4vmin rgba(0,0,0,.2);}
  #soundBtn.hint{animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

  #cf{position:fixed;inset:0;z-index:8;pointer-events:none;}

  @media (max-width:900px){
    .center{padding:15vmin 4vmin 4vmin;}
    .names{font-size:11vmin;} h1{font-size:10vmin;}
  }
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="sun"></div>

  <div class="decor cloud" style="top:9vh;animation-duration:85s">☁️</div>
  <div class="decor cloud" style="top:22vh;animation-duration:120s;animation-delay:-50s;font-size:9vmin">☁️</div>
  <div class="decor bird" style="top:15vh;animation-duration:40s">🐦</div>
  <div class="decor bird" style="top:19vh;animation-duration:52s;animation-delay:-16s">🕊️</div>

  <div class="hill h1"></div>
  <div class="hill h2"></div>
  <svg class="acacia" style="left:3vw" viewBox="0 0 100 80"><path d="M48 80h4V44c9-1 15-4 21-9 8-7 10-16 3-19-3-1-7 0-10 2 1-4-1-8-6-9-6-1-11 3-11 8-4-3-10-3-13 1-3 4-1 9 4 11-6 1-11 5-11 10 0 6 8 10 18 10 3 0 6-.4 8-1z"/></svg>
  <svg class="acacia" style="right:5vw;width:20vmin" viewBox="0 0 100 80"><path d="M48 80h4V44c9-1 15-4 21-9 8-7 10-16 3-19-3-1-7 0-10 2 1-4-1-8-6-9-6-1-11 3-11 8-4-3-10-3-13 1-3 4-1 9 4 11-6 1-11 5-11 10 0 6 8 10 18 10 3 0 6-.4 8-1z"/></svg>
  <div class="hill h3"></div>
  <div class="ground"></div>

  <div class="decor walker" style="animation-duration:46s">🦁</div>
  <div class="decor walker flip" style="animation-duration:60s;animation-delay:-18s;font-size:13vmin">🐘</div>
  <div class="decor walker" style="animation-duration:34s;animation-delay:-9s">🦓</div>
  <div class="decor walker" style="animation-duration:70s;animation-delay:-30s;font-size:8vmin">🐊</div>
  <div class="decor walker flip" style="animation-duration:28s;animation-delay:-6s;font-size:7vmin">🐒</div>

  <div class="decor balloon" style="left:7vw;animation-duration:18s">🎈</div>
  <div class="decor balloon" style="left:24vw;animation-duration:22s;animation-delay:-7s">🎈</div>
  <div class="decor balloon" style="right:9vw;animation-duration:20s;animation-delay:-11s">🎈</div>
  <div class="decor balloon" style="right:26vw;animation-duration:25s;animation-delay:-3s">🎈</div>

  <div id="bunting"><div class="string"></div><div class="flags" id="flags"></div></div>

  <canvas id="cf"></canvas>

  <button id="soundBtn" class="hint" onclick="onSoundBtn(event)">🔊 Tap for party sounds</button>

  <!-- WELCOME POSTER -->
  <div class="center">
    <div class="poster">
      <span class="eyebrow">🎉 WELCOME TO 🎉</span>
      <div class="names">Ezekiel <span class="amp">&amp;</span> Ezariah's</div>
      <h1>Birthday Party!</h1>
      <div class="cakes">🎂🎈🎁🥳🎈🎂</div>
      <div class="msg">So happy you're here — let's celebrate! 🎉</div>
      <a class="startlink" href="index.html">🎮 Start the party game ▶</a>
    </div>
  </div>

<script>
/* ---------- bunting ---------- */
(function(){ const cols=['#ff6b6b','#ffb52e','#ffe14d','#4ecb71','#39b7d6','#8a6bff','#ff8fc7'];
  const f=document.getElementById('flags'); let html='';
  for(let i=0;i<18;i++){ html+=`<div class="flag" style="background:${cols[i%cols.length]};animation-delay:${(i%5)*-0.4}s"></div>`; }
  f.innerHTML=html; })();

/* ---------- ambient party sounds ---------- */
const SOUNDS=['dog','cat','cow','duck','pig','lion','tiger','elephant','monkey','zebra','hyena','snake','crocodile'];
let AC=null, pad=null, ambTimer=null, soundOn=false, started=false;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; }
function makePad(){
  const c=ac(), out=c.createGain(); out.gain.value=0.05; out.connect(c.destination);
  const freqs=[130.81,196.00,261.63], nodes=[];
  freqs.forEach((f,i)=>{ const o=c.createOscillator(),g=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();
    o.type='sine'; o.frequency.value=f*(i===2?1.003:1); g.gain.value=0.5;
    lfo.frequency.value=0.08+i*0.03; lg.gain.value=0.25; lfo.connect(lg).connect(g.gain);
    o.connect(g).connect(out); o.start(); lfo.start(); nodes.push(o,lfo); });
  return { stop(){ out.gain.setTargetAtTime(0,c.currentTime,.3); setTimeout(()=>{nodes.forEach(n=>{try{n.stop()}catch(e){}}); try{out.disconnect()}catch(e){}},600); } };
}
const cache={};
function critter(){ if(!soundOn)return; const id=SOUNDS[Math.floor(Math.random()*SOUNDS.length)];
  let a=cache[id]; if(!a){ a=new Audio('assets/sounds/'+id+'.mp3'); cache[id]=a; }
  a.volume=0.3; a.currentTime=0; a.play().catch(()=>{}); }
function schedule(){ ambTimer=setTimeout(()=>{ critter(); schedule(); }, 3500+Math.random()*5500); }
function startSound(){ if(started)return; started=true; soundOn=true; ac(); pad=makePad(); critter(); schedule(); updateBtn(); }
function stopSound(){ soundOn=false; if(ambTimer){clearTimeout(ambTimer);ambTimer=null;} if(pad){pad.stop();pad=null;} updateBtn(); }
function updateBtn(){ const b=document.getElementById('soundBtn'); b.classList.remove('hint');
  b.textContent = soundOn ? '🔊 Party sounds: ON' : '🔇 Party sounds: OFF'; }
function onSoundBtn(e){ e.stopPropagation(); if(!started){ startSound(); } else if(soundOn){ stopSound(); } else { soundOn=true; ac(); if(!pad)pad=makePad(); schedule(); updateBtn(); } }
addEventListener('pointerdown', ()=>{ if(!started) startSound(); });

/* ---------- gentle confetti ---------- */
const cv=document.getElementById('cf'),cx=cv.getContext('2d'); let parts=[],raf=false;
function rs(){cv.width=innerWidth;cv.height=innerHeight;} rs(); addEventListener('resize',rs);
const COLS=['#f5a623','#ff6b35','#2ecc71','#1fb6c1','#e94b5a','#ffd76a','#8a6bff','#ffffff'];
function burst(n){ for(let i=0;i<n;i++) parts.push({x:Math.random()*innerWidth,y:-20,
  vx:(Math.random()-.5)*3.4,vy:Math.random()*2.4+1.6,g:.16,s:6+Math.random()*9,r:Math.random()*6,vr:(Math.random()-.5)*.35,
  col:COLS[Math.floor(Math.random()*COLS.length)]}); if(!raf){raf=true;requestAnimationFrame(loop);} }
function loop(){ cx.clearRect(0,0,cv.width,cv.height); parts=parts.filter(p=>p.y<cv.height+40);
  parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);
    cx.fillStyle=p.col;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();});
  if(parts.length)requestAnimationFrame(loop); else raf=false; }
setInterval(()=>{ if(!document.hidden) burst(18); }, 5000);
burst(40);
</script>
</body>
</html>
